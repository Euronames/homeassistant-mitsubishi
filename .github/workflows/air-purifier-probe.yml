name: "Air purifier read-probe tests"

on:
  workflow_dispatch:
    inputs:
      library_repository:
        description: "Approved public library fork in owner/repository form"
        required: true
        type: string
      library_revision:
        description: "Full 40-character commit SHA of the paired library changes"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-read-probe:
    name: "Read probe / HA 2026.10.3 / Python 3.14.2"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LIBRARY_REPOSITORY: "${{ inputs.library_repository }}"
      LIBRARY_REVISION: "${{ inputs.library_revision }}"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: "Validate explicit library source"
        run: |
          python3 - <<'PY'
          import os
          import re

          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", os.environ["LIBRARY_REPOSITORY"]):
              raise SystemExit("Expected an explicit owner/repository, not a URL")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", os.environ["LIBRARY_REVISION"]):
              raise SystemExit("Expected an immutable full commit SHA, not a moving branch")
          PY

      - name: "Check out integration at the selected workflow commit"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "${{ github.sha }}"
          path: integration
          persist-credentials: false

      - name: "Check out the paired experimental library"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: "${{ inputs.library_repository }}"
          ref: "${{ inputs.library_revision }}"
          path: library
          persist-credentials: false

      - name: "Set up compatible Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.2"

      - name: "Install the focused test environment"
        run: >-
          python -m pip install
          -r integration/requirements-probe-test.txt

      - name: "Install the exact deployment package through Home Assistant's installer"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          import homeassistant
          from homeassistant.util.package import install_package
          from packaging.requirements import Requirement

          manifest = json.loads(Path("integration/custom_components/mitsubishi/manifest.json").read_text())
          assert manifest["version"] == "0.6.2.dev2026102501"
          assert len(manifest["requirements"]) == 1
          requirement = manifest["requirements"][0]
          parsed = Requirement(requirement)
          assert parsed.name == "pymitsubishi"
          archive_url, fragment = parsed.url.rsplit("#", 1)
          expected = (
              f"https://github.com/{os.environ['LIBRARY_REPOSITORY']}/archive/"
              f"{os.environ['LIBRARY_REVISION']}.zip"
          )
          assert archive_url == expected
          assert re.fullmatch(r"sha256=[0-9a-f]{64}", fragment)
          constraints = Path(homeassistant.__file__).with_name("package_constraints.txt")
          assert constraints.is_file()
          if not install_package(requirement, constraints=str(constraints), timeout=60):
              raise SystemExit("Home Assistant could not install the pinned deployment archive")
          PY

      - name: "Check dependency consistency"
        run: python -m pip check

      - name: "Verify the intended Core, plugin and library are actually imported"
        run: |
          python - <<'PY'
          import hashlib
          import inspect
          import io
          import json
          from importlib.metadata import distribution, version
          import os
          from pathlib import Path
          import sys
          import urllib.request
          import zipfile

          from awesomeversion import AwesomeVersion
          from homeassistant.util.package import is_installed
          from packaging.requirements import Requirement
          import pymitsubishi
          from pymitsubishi import MitsubishiController

          assert sys.version_info[:3] == (3, 14, 2)
          assert version("homeassistant") == "2026.10.3"
          assert version("pytest-homeassistant-custom-component") == "0.13.374"
          manifest = json.loads(Path("integration/custom_components/mitsubishi/manifest.json").read_text())
          assert version("pymitsubishi") == pymitsubishi.__version__ == manifest["version"]
          assert AwesomeVersion("0.6.1") < AwesomeVersion(manifest["version"]) < AwesomeVersion("0.6.2")
          assert not is_installed("pymitsubishi==0.6.1"), "Rollback must require the official package"
          source_checkout = Path("library").resolve()
          assert not Path(pymitsubishi.__file__).resolve().is_relative_to(source_checkout)
          assert not Path(inspect.getfile(MitsubishiController.fetch_air_purifier_status)).resolve().is_relative_to(source_checkout)
          requirement = Requirement(manifest["requirements"][0])
          archive_url, expected_hash = requirement.url.rsplit("#sha256=", 1)
          origin = json.loads(distribution("pymitsubishi").read_text("direct_url.json"))
          assert origin["url"] == archive_url
          archive_info = origin["archive_info"]
          print("Installer archive metadata:", json.dumps(archive_info, sort_keys=True))
          with urllib.request.urlopen(archive_url, timeout=60) as response:
              archive_bytes = response.read()
          assert hashlib.sha256(archive_bytes).hexdigest() == expected_hash, "Downloaded archive checksum mismatch"
          package_root = Path(pymitsubishi.__file__).resolve().parent
          prefix = f"pymitsubishi-{os.environ['LIBRARY_REVISION']}/pymitsubishi/"
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              expected_modules = {
                  name.removeprefix(prefix): archive.read(name)
                  for name in archive.namelist()
                  if name.startswith(prefix) and name.endswith(".py")
              }
              installed_modules = {path.relative_to(package_root).as_posix() for path in package_root.rglob("*.py")}
              assert expected_modules and installed_modules == set(expected_modules), "Installed module inventory mismatch"
              for name, content in expected_modules.items():
                  assert (package_root / name).read_bytes() == content, f"Installed source mismatch: {name}"
          installed_hash = archive_info.get("hashes", {}).get("sha256") or archive_info.get("hash", "").removeprefix("sha256=")
          if installed_hash:
              assert installed_hash == expected_hash, f"Recorded archive hash mismatch: {installed_hash}"
          else:
              print("Installer did not record a SHA-256; archive and installed source were independently verified")
          print("Verified installed Python modules:", len(expected_modules))
          print("Verified installed deployment package:", version("pymitsubishi"), archive_url, expected_hash)
          PY

      - name: "Record resolved package versions for review"
        run: python -m pip freeze

      - name: "Run all library regression tests with network disabled"
        working-directory: library
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -P -m pytest -p pytest_socket -o addopts=
          -o pythonpath= --import-mode=importlib
          --disable-socket --allow-unix-socket
          tests -q

      - name: "Run focused Home Assistant service tests with network disabled"
        working-directory: integration
        run: >-
          python -m pytest -o addopts=
          --disable-socket --allow-unix-socket
          tests/test_services.py -q
